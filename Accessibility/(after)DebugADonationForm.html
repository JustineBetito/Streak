<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Donation Form</title>
</head>
<body>
  <header>
    <h1>Donation Form</h1>
  </header>

  <main>
    <form action="" method="POST">

      <fieldset>
        <label for="username">Full Name:</label>
        <input type="text" id="username" name="name" placeholder="Justine Danielle Betito" required/>

        <label for="useremail">Email Address:</label>
        <input type="email" id="useremail" name="email" placeholder="justine6@gmail.com" required/>
      </fieldset>

      <fieldset>
        <label for="donation-amount">Donation Amount ($):</label>
        <input type="number" id="donation-amount" name="amount" required/>
      </fieldset>

      <fieldset>
        <input type="checkbox" id="subscribe" name="newsletter"/>
        <label for="subscribe">Subscribe</label>

        <input type="submit" value="Send"/>
      </fieldset>
    </form>
  </main>
</body>
</html>
