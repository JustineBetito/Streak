Google Lighthouse is a popular web metric checker you can run directly within
 Chrome DevTools. Running Lighthouse in Chrome DevTools allows you to audit
  not only live websites but also locally developed ones running on your computer.


You can also run Lighthouse audits online using PageSpeed Insights
 at pagespeed.web.dev. Because PageSpeed Insights is a hosted web
  service running on Google's servers, it cannot access websites running
   locally on your computer, meaning it can only test publicly accessible,
    live websites.

WAVE is another reliable accessibility checker you can use as a Chrome extension
 or on the web. All you need to do is enter the URL of your website and a comprehensive accessibility report will be generated for you. This report includes accessibility features implemented, ARIA, and contrasts.

The IBM Equal Access Accessibility Checker is another robust tool
 for improving digital content accessibility. With it, you can scan
  your websites for accessibility issues and generate a detailed report.

-->
