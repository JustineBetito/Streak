<!DOCTYPE html>
<html lang="en">

    <body>
        <header>

        </header>

        <main>

            <form action="">
                <label>
                    Name:
                    <input type="text"/>
                </label>
            </form>


            <form action="">
                <label for="email">Email: </label>
                <input type="email" id="email" placeholder="Niggamusmaximus@gmail.com"/>
            </form>


            <!--<button>Press Me!</button>-->

            <button type="button">Press Me Again?</button>

            <!--

            <script>
                const btn = document.querySelector("button");
                btn.addEventListener("click", () => alert("You clicked on the alert button"));
            </script>

            -->


            <form action="">
                <label for="email_input">Enter your email: </label>
                <input type="email" id="email_input" name="user_email" placeholder="Nigamus@gmail.com"/>
                <button type="reset">Reset</button>
                <button type="submit">Submit now!</button>
            </form>



            <!-- Another way for button -->

            <input class="start-btn" type="button" value="Start Game" />
            <script src="index.js"></script>



            <!-- Form with required attribute -->

            <form action="">
                <label for="email_input">Enter Your email (Required): </label>
                <input type="email" id="email_input" name="user_email" placeholder="Niggamus@gmail.com" required/>
                <button type="submit">Submit</button>
            </form>


            <!-- with min and max length -->
            <form action="">
                <label for="email_input">Enter Your email (Required): </label>
                <input type="email"
                        id="email_input"
                        name="user_email"
                        placeholder="Niggamus@gmail.com"
                        required type="gmail"
                        minlength="5"
                        maxlength="5"/>
                <button type="submit">Submit</button>
            </form>
        </main>


        <!-- disabled -->

        <form action="">
                <label for="email_input">Enter Your email (Required): </label>
                <input type="email"
                        id="email_input"
                        name="user_email"
                        placeholder="Niggamus@gmail.com"
                        required type="gmail"
                        minlength="5"
                        maxlength="5"
                        disabled/>
                <button type="submit">Submit</button>
            </form>


        <!-- Readonly -->


        <form action="">
                <label for="email_input">Enter Your email (Required): </label>
                <input type="email"
                        id="email_input"
                        name="user_email"
                        placeholder="Niggamus@gmail.com"
                        required type="gmail"
                        minlength="5"
                        maxlength="5"
                        readonly
                        value="Ng@ga"/>
                <button type="submit">Submit</button>
            </form>



    </body>
   
</html>
