<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Survey Form</title>
        <meta charset="UTF-8"/>

        <meta name="description" content="Survey Form on HTML (Certification Project on FreeCodeCamp)"/>
        <meta property="og:title" content="Survey Form"/>
        <meta property="og:type" content="website"/>
    </head>
    <body>
        <header>
            <h1 id="title">FreeCodeCamp Survey Form Certification Project</h1>

            <p id="description">
                Thank you for taking the time to help us improve the platform.
            </p>
        </header>

        <main>
           <form id="survey-form" method="POST" action="">
                <fieldset>
                    <legend>Please Input Your Personal Information</legend>

                    <label for="name" id="name-label">Name:</label>
                    <input type="text" id="name" placeholder="Jan Asley Gortex"/>

                    <label for="email" id="email-label">Email Address (Required):</label>
                    <input type="email" id="email" placeholder="thegoat543@gmail.com" required/>

                    <label for="number" id="number-label">Age (Optional):</label>
                    <input type="number" id="number" min="3" max="100" placeholder="67"/>
                </fieldset>

                <fieldset>
                    <legend>Which option best describes your current role?</legend>

                    <label for=""></label>
                </fieldset>
           </form>
        
        </main>

    </body>
</html>
